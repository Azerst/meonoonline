<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Exploding Kittens</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>
<div class="bg-grid"></div>

<!-- AUTH -->
<div id="sc-auth" class="screen on">
  <div class="glass bevel auth-box">
    <h1 class="auth-title">MÈO NỔ</h1>
    <p class="auth-sub">EXPLODING KITTENS · ONLINE</p>
    <div class="tabs">
      <button class="tab active" data-tab="login" onclick="UI.switchAuthTab('login')">Đăng Nhập</button>
      <button class="tab" data-tab="register" onclick="UI.switchAuthTab('register')">Đăng Ký</button>
    </div>
    <div id="authLoginForm" class="form-col">
      <input type="text" id="loginUser" placeholder="Tên đăng nhập" maxlength="20" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Mật khẩu" autocomplete="current-password" onkeypress="if(event.key==='Enter')UI.doLogin()">
      <button class="btn-primary bevel-sm" onclick="UI.doLogin()">Đăng Nhập</button>
    </div>
    <div id="authRegisterForm" class="form-col" style="display:none">
      <input type="text" id="regUser" placeholder="Tên đăng nhập (≥3 ký tự)" maxlength="20">
      <input type="password" id="regPass" placeholder="Mật khẩu (≥4 ký tự)">
      <input type="password" id="regPass2" placeholder="Nhập lại mật khẩu" onkeypress="if(event.key==='Enter')UI.doRegister()">
      <button class="btn-primary bevel-sm" onclick="UI.doRegister()">Tạo Tài Khoản</button>
    </div>
    <div id="authMsg" class="auth-msg"></div>
    <button class="link-btn" onclick="UI.playAsGuest()">Chơi với tư cách Khách</button>
  </div>
</div>

<!-- MENU -->
<div id="sc-menu" class="screen">
  <div class="glass bevel topbar">
    <div class="topbar-info">
      <div class="topbar-name">
        <span id="topbarName">—</span>
        <span id="topbarRoleBadge" class="role-badge" style="display:none"></span>
      </div>
      <div class="topbar-stats">
        <span>Trận <b id="topbarGames">0</b></span>
        <span>Thắng <b id="topbarWins">0</b></span>
        <span>Bạn bè <b id="topbarFriends">0</b></span>
      </div>
    </div>
    <div class="topbar-avatar" id="topbarAvatar" onclick="UI.openProfile()"></div>
  </div>
  <div class="menu-body">
    <button class="glass btn-hero bevel" onclick="UI.createRoom()">TẠO PHÒNG</button>
    <div class="menu-grid">
      <div class="glass menu-card bevel" onclick="UI.openSoloModal()">
        <div class="menu-card-title">SOLO</div>
        <div class="menu-card-sub">Chơi với Bot</div>
      </div>
      <div class="glass menu-card bevel" onclick="UI.openJoinRoomModal()">
        <div class="menu-card-title">VÀO PHÒNG</div>
        <div class="menu-card-sub">Nhập mã 6 số</div>
      </div>
      <div class="glass menu-card bevel" onclick="UI.openHowToPlay()">
        <div class="menu-card-title">HƯỚNG DẪN</div>
        <div class="menu-card-sub">Luật & Lá bài</div>
      </div>
      <div class="glass menu-card bevel" id="friendsCard" onclick="UI.openFriends()">
        <div class="menu-card-title">BẠN BÈ</div>
        <div class="menu-card-sub">Kết bạn & Mời</div>
        <div class="menu-card-badge" id="friendsBadge" style="display:none">0</div>
      </div>
      <div class="glass menu-card bevel" onclick="UI.openProfile()">
        <div class="menu-card-title">HỒ SƠ</div>
        <div class="menu-card-sub">Tài khoản</div>
      </div>
      <div class="glass menu-card bevel" id="adminCard" style="display:none" onclick="UI.openAdminPanel()">
        <div class="menu-card-title">QUẢN TRỊ</div>
        <div class="menu-card-sub">Admin Panel</div>
      </div>
    </div>
  </div>
</div>

<!-- LOBBY -->
<div id="sc-lobby" class="screen">
  <div class="glass bevel lobby-box">
    <h2 class="lobby-title">PHÒNG CHỜ</h2>
    <div class="room-code" id="lobbyCode" onclick="UI.copyCode()">------</div>
    <div id="lobbyStatus" class="lobby-status">Đang kết nối...</div>
    <div class="plist" id="lobbyPlayers"></div>
    <div id="hostControls" class="form-col" style="display:none">
      <label class="lbl">Chế độ Bot</label>
      <select id="lobbyBotMode">
        <option value="normal">Bình thường</option>
        <option value="smart" selected>Thông minh</option>
        <option value="ultimate">Tối thượng</option>
      </select>
      <div class="row-2">
        <button class="btn-outline bevel-sm" onclick="UI.addBot()">+ Bot</button>
        <button class="btn-outline bevel-sm" onclick="UI.removeBot()">- Bot</button>
      </div>
      <button class="btn-outline bevel-sm" id="inviteFriendsBtn" style="display:none" onclick="UI.openInviteFriends()">Mời Bạn Bè</button>
    </div>
    <div class="form-col">
      <button class="btn-primary bevel-sm" id="btnStart" style="display:none" onclick="UI.startMultiplayerGame()">Bắt Đầu</button>
      <button class="btn-danger bevel-sm" onclick="UI.leaveRoom()">Rời Phòng</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="sc-game" class="screen">
  <div class="glass bevel game-head">
    <div class="badge">Sống <b id="uiAlive">0</b></div>
    <div class="badge hot" id="uiTurn">Lượt —</div>
    <div class="badge">Bài <b id="uiDeck">0</b></div>
    <div class="badge" id="uiTurnsLeft" style="display:none">×1</div>
    <button class="btn-quit" onclick="UI.leaveRoom()">Thoát</button>
  </div>
  <div class="opponents" id="opponentsArea"></div>
  <div class="board">
    <div class="game-log" id="gameLog"></div>
    <div class="pile disc" id="discardPile">—</div>
    <div class="pile deck" id="deckPile" onclick="UI.onDrawClick()">
      <span>RÚT</span>
      <div class="pile-badge" id="deckBadge">0</div>
    </div>
  </div>
  <div class="glass bevel hand-area">
    <div class="hand-action-bar" id="handActionBar"></div>
    <div class="hand-label">Bài trên tay (<span id="uiHandCount">0</span>)</div>
    <div class="hand-scroll" id="handArea"></div>
  </div>
</div>

<!-- SHOWCASE (card played / steal) -->
<div class="showcase" id="showcase">
  <div class="showcase-card" id="scCard"></div>
  <div class="showcase-label" id="scLabel"></div>
  <div class="showcase-action" id="scAction"></div>
</div>

<!-- 1-line notification -->
<div class="notif" id="notif"></div>

<!-- Chat -->
<div class="chat-ov" id="chatOverlay" onclick="UI.toggleChat()"></div>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head"><span>Chat</span><span class="chat-x" onclick="UI.toggleChat()">×</span></div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-input">
    <input type="text" id="chatInput" onkeypress="if(event.key==='Enter')UI.sendChat()" placeholder="Nhập...">
    <button onclick="UI.sendChat()">Gửi</button>
  </div>
</div>
<div class="chat-fab" id="chatFab" onclick="UI.toggleChat()">Chat</div>

<!-- Modal -->
<div class="overlay" id="overlayModal">
  <div class="glass bevel modal" id="modalContent"></div>
</div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>

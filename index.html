<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Exploding Kittens - Online Multiplayer</title>
<!-- Thư viện PeerJS (Sử dụng CDN dự phòng nếu CDN chính lỗi) -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
  // Fallback CDN nếu unpkg bị chặn
  if (typeof Peer === 'undefined') {
    document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"><\/script>');
  }
</script>
<style>
  :root{--red:#d93828;--red-dark:#b52a1c;--bg-main:#eef2f6;--grid:rgba(0,0,0,0.07);
    --glass:rgba(255,255,255,0.45);--text:#2c1b18;--text-l:#5a4a48;--cut:20px}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background-color:var(--bg-main);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:32px 32px;color:var(--text);height:100vh;overflow:hidden;
    -webkit-font-smoothing:antialiased;user-select:none}
  .glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse at 20% 20%,rgba(255,122,92,0.4) 0%,transparent 50%),
      radial-gradient(ellipse at 80% 80%,rgba(217,56,40,0.4) 0%,transparent 50%);
    filter:blur(50px);animation:pulseGlow 6s ease-in-out infinite alternate}
  @keyframes pulseGlow{0%{transform:scale(.95);opacity:.6}100%{transform:scale(1.05);opacity:1}}
  .glass{position:relative;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
    box-shadow:0 1.5px 0 rgba(255,255,255,.9) inset,0 10px 30px rgba(0,0,0,.1);
    border:1px solid rgba(255,255,255,.4);transition:transform .3s}
  button{font-family:inherit;font-weight:700;font-size:15px;padding:12px 20px;border:none;border-radius:8px;
    cursor:pointer;transition:all .2s;background:linear-gradient(180deg,#fff,#f0f0f0);color:var(--red-dark);
    box-shadow:0 4px 10px rgba(0,0,0,.1),0 1px 0 rgba(255,255,255,1) inset}
  button:hover{transform:translateY(-2px);box-shadow:0 6px 15px rgba(0,0,0,.15)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:grayscale(1)}
  .btn-p{background:linear-gradient(180deg,#ff6b6b,var(--red));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
  .btn-d{background:linear-gradient(180deg,#ff9800,#e65100);color:#fff}
  .btn-o{background:transparent;border:1.5px solid rgba(0,0,0,.2);color:var(--text-l)}
  input{width:100%;padding:13px 15px;border-radius:8px;border:2px solid rgba(255,255,255,.6);
    background:rgba(255,255,255,.5);font-family:inherit;font-size:15px;color:var(--text);outline:none;transition:all .2s}
  input:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px rgba(217,56,40,.2)}
  select.mode-select{width:100%;padding:12px 15px;border-radius:8px;border:2px solid rgba(255,255,255,.6);
    background:rgba(255,255,255,.5);font-family:inherit;font-size:14px;color:var(--text);outline:none;
    cursor:pointer;font-weight:600;transition:all .2s}
  select.mode-select:focus{background:#fff;border-color:var(--red);box-shadow:0 0 0 4px rgba(217,56,40,.2)}
  .screen{display:none;width:100%;height:100%;position:absolute;top:0;left:0;flex-direction:column}
  .screen.on{display:flex}
  #sc-home{justify-content:center;align-items:center;padding:20px;overflow-y:auto}
  .home-box{width:100%;max-width:400px;padding:28px 24px;display:flex;flex-direction:column;gap:12px;text-align:center;margin:auto}
  .home-title{font-size:34px;font-weight:900;color:var(--red-dark);letter-spacing:1px;text-transform:uppercase}
  .home-sub{font-size:12px;color:var(--text-l)}
  #sc-lobby{justify-content:center;align-items:center;padding:20px}
  .lobby-box{width:100%;max-width:500px;padding:30px;display:flex;flex-direction:column;gap:14px}
  .room-code{font-size:38px;font-weight:900;letter-spacing:8px;color:var(--red);text-align:center;
    cursor:pointer;padding:14px;border-radius:8px;background:rgba(255,255,255,.5);font-family:monospace;border:2px dashed rgba(217,56,40,.3)}
  .plist{display:flex;flex-direction:column;gap:8px;max-height:250px;overflow-y:auto;min-height:60px}
  .pitem{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,.5);
    border-radius:8px;border:1px solid rgba(255,255,255,.8)}
  .pitem .av{font-size:22px}.pitem .nm{flex:1;font-weight:bold}
  .pitem .st{font-size:11px;font-weight:bold;color:var(--red);text-transform:uppercase}
  .plist-empty{text-align:center;padding:24px;color:var(--text-l);font-size:13px;font-style:italic}
  .connecting{display:inline-block;width:14px;height:14px;border:2px solid var(--red);
    border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  #sc-game{display:none;flex-direction:column;height:100%;padding:8px;overflow:hidden;gap:8px}
  #sc-game.on{display:flex}
  .ghead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:bold;font-size:13px;flex-shrink:0;gap:6px;flex-wrap:wrap}
  .badge{background:rgba(255,255,255,.6);padding:5px 12px;border-radius:20px;box-shadow:0 2px 5px rgba(0,0,0,.05);font-size:12px}
  .badge.hot{background:var(--red);color:#fff;animation:pulseBadge 1.5s infinite}
  @keyframes pulseBadge{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .opps{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
  .opp{display:flex;flex-direction:column;align-items:center;padding:8px 12px;min-width:76px;transition:.3s;position:relative;--cut:12px}
  .opp.turn{box-shadow:0 0 20px var(--red);border:2px solid var(--red);transform:scale(1.05)}
  .opp.dead{opacity:.4;filter:grayscale(1)}
  .opp.dead::after{content:'💀';position:absolute;font-size:36px;top:50%;left:50%;transform:translate(-50%,-50%)}
  .opp .av{font-size:28px;margin-bottom:2px}
  .opp .nm{font-size:11px;font-weight:bold;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .opp .cnt{font-size:11px;color:var(--red-dark);font-weight:bold}
  .board{flex:1;display:flex;justify-content:center;align-items:center;gap:30px;position:relative;min-height:0}
  .pile{width:96px;height:134px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:38px;position:relative;flex-shrink:0;transition:transform .2s}
  .deck{background:linear-gradient(135deg,var(--red),var(--red-dark));cursor:pointer;
    box-shadow:0 10px 20px rgba(217,56,40,.4);border:3px solid #fff}
  .deck:hover{transform:translateY(-5px) scale(1.02)}
  .deck.can{animation:deckPulse 1.5s infinite}
  @keyframes deckPulse{0%,100%{box-shadow:0 0 15px rgba(217,56,40,.6)}50%{box-shadow:0 0 35px rgba(217,56,40,1)}}
  .deck.locked{opacity:.6;cursor:not-allowed;filter:grayscale(.5)}
  .deck.shuffling{animation:shuffleAnim .8s ease-in-out}
  @keyframes shuffleAnim{
    0%{transform:translateY(0) rotate(0) scale(1)}
    25%{transform:translateY(-15px) rotate(-10deg) scale(1.05)}
    50%{transform:translateY(5px) rotate(10deg) scale(.95)}
    75%{transform:translateY(-5px) rotate(-5deg) scale(1.02)}
    100%{transform:translateY(0) rotate(0) scale(1)}
  }
  .disc{background:rgba(255,255,255,.3);border:2px dashed rgba(255,255,255,.8)}
  .badge-p{position:absolute;bottom:-8px;right:-8px;background:#fff;color:var(--red);min-width:28px;height:28px;
    padding:0 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:13px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
  .glog{position:absolute;top:5px;left:5px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;
    padding:8px 10px;border-radius:8px;pointer-events:none;max-width:220px;backdrop-filter:blur(5px);line-height:1.4}
  .hand-area{padding:12px;min-height:160px;display:flex;flex-direction:column;flex-shrink:0;--cut:14px}
  .hand-action-bar{display:none;margin-bottom:6px;padding:8px 12px;background:rgba(0,204,102,.15);
    border:2px solid #00cc66;border-radius:8px;font-size:12px;font-weight:bold;align-items:center;gap:8px;flex-wrap:wrap}
  .hand-action-bar.on{display:flex}
  .hand-action-bar button{padding:6px 14px;font-size:12px}
  .hand-scroll{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;align-items:center;scrollbar-width:thin}
  .card{width:86px;height:124px;border-radius:10px;flex-shrink:0;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:6px 4px;cursor:pointer;position:relative;
    background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.15);border:2px solid #fff;transition:all .2s;overflow:hidden}
  .card:hover:not(.dis){transform:translateY(-12px) scale(1.05);z-index:10;
    box-shadow:0 15px 25px rgba(0,0,0,.3);border-color:var(--red)}
  .card.dis{opacity:.35;filter:grayscale(.8);cursor:not-allowed}
  .card .ic{font-size:30px;margin-top:2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
  .card .tt{font-size:9px;font-weight:900;text-transform:uppercase;text-align:center;line-height:1.1;color:#333;margin-top:2px}
  .card .ds{font-size:7.5px;text-align:center;color:#555;line-height:1.15;font-weight:600;
    background:rgba(0,0,0,.06);padding:2px 3px;border-radius:4px;width:100%;margin-top:2px}
  .c-EK{background:linear-gradient(135deg,#ffcccc,#ff9999);border-color:#ff4d4d}
  .c-DEFUSE{background:linear-gradient(135deg,#ccffcc,#99ff99);border-color:#4dff4d}
  .c-NOPE{background:linear-gradient(135deg,#ffe6cc,#ffcc99);border-color:#ff9933}
  .c-ATTACK{background:linear-gradient(135deg,#ffcccc,#ff6666);border-color:#cc0000}
  .c-ATTACK .tt,.c-ATTACK .ds{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);background:rgba(0,0,0,.25)}
  .c-SKIP{background:linear-gradient(135deg,#cce6ff,#99ccff);border-color:#3399ff}
  .c-SEE_FUTURE{background:linear-gradient(135deg,#e6ccff,#cc99ff);border-color:#9933ff}
  .c-SHUFFLE{background:linear-gradient(135deg,#ccffff,#99ffff);border-color:#33ffff}
  .c-FAVOR{background:linear-gradient(135deg,#ffccff,#ff99ff);border-color:#ff33ff}
  .c-CAT{background:linear-gradient(135deg,#fff2cc,#ffe699);border-color:#ffcc00}
  @keyframes newDrawIn{0%{transform:translateX(-90px) scale(.6) rotate(-10deg);opacity:0}
    60%{transform:translateX(8px) scale(1.1) rotate(3deg);opacity:1}
    100%{transform:translateX(0) scale(1) rotate(0);opacity:1}}
  .card.new-draw{animation:newDrawIn .65s cubic-bezier(.34,1.56,.64,1);
    border-color:gold!important;
    box-shadow:0 0 25px gold,0 0 50px rgba(255,215,0,.55),0 8px 20px rgba(0,0,0,.25)!important;z-index:6}
  .card.selected{transform:translateY(-18px) scale(1.08)!important;border-color:#00cc66!important;
    box-shadow:0 0 20px #00ff88,0 0 40px rgba(0,255,136,.5),0 12px 20px rgba(0,0,0,.3)!important;z-index:8!important}
  .card.selected::before{content:'✓';position:absolute;top:-8px;right:-8px;background:#00cc66;color:#fff;
    width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:10}
  .chat-ov{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;backdrop-filter:blur(2px)}
  .chat-ov.on{display:block}
  .chat-p{position:fixed;right:20px;top:50%;transform:translateY(-50%) translateX(120%);width:320px;height:400px;
    display:flex;flex-direction:column;z-index:201;transition:transform .3s;background:rgba(255,255,255,.9)}
  .chat-p.on{transform:translateY(-50%) translateX(0)}
  .chat-h{padding:14px;border-bottom:1px solid rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center;font-weight:bold}
  .chat-x{cursor:pointer;font-size:20px;color:var(--red);padding:0 5px}
  .chat-m{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
  .chat-m .u{color:var(--red);font-weight:bold}
  .chat-i{display:flex;padding:12px;gap:8px;border-top:1px solid rgba(0,0,0,.1)}
  .chat-i input{padding:8px;font-size:14px}.chat-i button{padding:8px 14px;font-size:14px}
  .chat-f{position:fixed;right:20px;bottom:190px;z-index:100;padding:10px 14px;border-radius:20px;
    background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border:1px solid #fff;
    box-shadow:0 4px 10px rgba(0,0,0,.1);cursor:pointer;font-weight:bold;font-size:14px;display:none}
  .chat-f.on{display:block}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);display:flex;
    justify-content:center;align-items:center;z-index:999;opacity:0;pointer-events:none;transition:.3s;padding:20px}
  .ov.on{opacity:1;pointer-events:auto}
  .modal{width:100%;max-width:500px;padding:26px;display:flex;flex-direction:column;gap:14px;
    text-align:center;transform:scale(.9);transition:.3s;max-height:90vh;overflow-y:auto}
  .ov.on .modal{transform:scale(1)}
  .modal h2{font-size:22px;color:var(--red-dark)}
  .modal p{font-size:14px;color:var(--text-l)}
  .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .mcol{display:flex;flex-direction:column;gap:8px}
  .shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes shake{10%,90%{transform:translate3d(-4px,0,0)}20%,80%{transform:translate3d(6px,0,0)}
    30%,50%,70%{transform:translate3d(-8px,0,0)}40%,60%{transform:translate3d(8px,0,0)}}
  .flash{animation:flashRed .6s ease-out}
  @keyframes flashRed{0%{box-shadow:inset 0 0 0 100vw rgba(255,0,0,.8)}100%{box-shadow:inset 0 0 0 100vw rgba(255,0,0,0)}}
  .particle{position:absolute;border-radius:50%;pointer-events:none;z-index:1000}
  .nope-btn{position:fixed;bottom:40%;left:50%;transform:translate(-50%,50%);z-index:200;
    padding:14px 36px;font-size:22px;background:linear-gradient(135deg,#ff0000,#ff6b6b);
    color:#fff;border-radius:50px;box-shadow:0 0 20px rgba(255,0,0,.6);border:3px solid #fff;cursor:pointer;
    animation:pulseNope .6s infinite alternate}
  @keyframes pulseNope{from{transform:translate(-50%,50%) scale(1)}to{transform:translate(-50%,50%) scale(1.08)}}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);
    color:#fff;padding:12px 24px;border-radius:30px;font-weight:bold;z-index:10000;
    animation:toastIn .3s ease-out;font-size:14px;max-width:90%;text-align:center}
  @keyframes toastIn{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.1);font-size:13px;gap:10px}
  .stat-row:last-child{border:none}
  @media (max-width:600px){
    .card{width:70px;height:104px;padding:5px 3px}
    .card .ic{font-size:24px}.card .tt{font-size:8px}
    .card .ds{font-size:6.5px;padding:1px 2px}
    .pile{width:78px;height:110px;font-size:28px}
    .chat-p{width:100%;right:0;height:50vh;top:auto;bottom:0;transform:translateY(100%);border-radius:20px 20px 0 0}
    .chat-p.on{transform:translateY(0)}
    .glog{max-width:150px;font-size:10px}
    .room-code{font-size:30px;letter-spacing:6px}
  }
</style>
</head>
<body>
<div class="glow"></div>

<!-- HOME -->
<div id="sc-home" class="screen on">
  <div class="glass home-box">
    <h1 class="home-title">Mèo Nổ</h1>
    <p class="home-sub">Exploding Kittens - Online</p>
    <input type="text" id="playerName" placeholder="Tên của bạn..." maxlength="15">
    
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
      <button class="btn-p" id="btnCreateRoom" onclick="UI.createRoom()">Tạo Phòng Online</button>
      <button class="btn-o" onclick="document.getElementById('joinArea').style.display='flex'">Tham Gia Phòng</button>
    </div>

    <div id="joinArea" style="display:none; flex-direction:column; gap:8px; margin-top:8px;">
      <input type="tel" id="joinCode" placeholder="Mã phòng (6 số)" maxlength="6" inputmode="numeric" pattern="[0-9]*"
        style="font-family:monospace;letter-spacing:6px;text-align:center;font-size:18px;font-weight:bold">
      <button id="btnJoinRoom" onclick="UI.joinRoom()">Vào Phòng</button>
    </div>

    <hr style="border:0;border-top:1px solid rgba(0,0,0,.1); margin: 15px 0;">
    
    <label style="font-size:12px;font-weight:bold;color:var(--text-l);text-align:left;">Chơi Offline với Bot:</label>
    <select id="soloPlayerCount" class="mode-select">
      <option value="2">2 người</option>
      <option value="3" selected>3 người</option>
      <option value="4">4 người</option>
      <option value="5">5 người</option>
      <option value="6">6 người</option>
    </select>
    <select id="botMode" class="mode-select">
      <option value="normal">😴 Bot Bình thường</option>
      <option value="smart" selected>🧠 Bot Thông minh</option>
      <option value="ultimate">👑 Bot Tối thượng</option>
    </select>
    <button onclick="UI.startSolo()" style="margin-top:5px;">🎮 Chơi với Bot</button>
  </div>
</div>

<!-- LOBBY -->
<div id="sc-lobby" class="screen">
  <div class="glass lobby-box">
    <h2 style="text-align:center;color:var(--red-dark)">Phòng Chờ Online</h2>
    <div class="room-code" id="lobbyCode" onclick="UI.copyCode()">------</div>
    <div id="lobbyStatus" style="text-align:center;font-size:12px;font-weight:bold;color:#666; min-height:30px;">Nhấn mã để copy · Chia sẻ cho bạn bè</div>
    
    <div class="plist" id="lobbyPlayers"></div>
    
    <div id="hostControls" style="display:none; flex-direction:column; gap:8px;">
      <label style="font-size:12px;font-weight:bold;color:var(--text-l);">Chế độ Bot (khi vào game):</label>
      <select id="lobbyBotMode" class="mode-select">
        <option value="normal">😴 Bình thường</option>
        <option value="smart" selected>🧠 Thông minh</option>
        <option value="ultimate">👑 Tối thượng</option>
      </select>
      <div style="display:flex; gap:8px; margin-top:5px;">
        <button class="btn-o" style="flex:1" onclick="UI.addBot()">+ Thêm Bot</button>
        <button class="btn-o" style="flex:1" onclick="UI.removeBot()">- Xóa Bot</button>
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap; margin-top:10px;">
      <button class="btn-p" id="btnStart" style="display:none; width:100%;" onclick="UI.startMultiplayerGame()">Bắt Đầu Game</button>
      <button class="btn-d" style="width:100%;" onclick="UI.leaveRoom()">Rời Phòng</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="sc-game" class="screen">
  <div class="glass ghead" style="--cut:14px">
    <div class="badge">Sống: <span id="uiAlive">0</span></div>
    <div class="badge hot" id="uiTurn">Lượt: ...</div>
    <div class="badge">Bài: <span id="uiDeck">0</span></div>
    <div class="badge" id="uiTurnsLeft" style="display:none;background:var(--red);color:#fff;">×1</div>
    <button onclick="UI.leaveRoom()" style="padding:5px 12px;font-size:11px;background:transparent;border:1px solid var(--red);color:var(--red)">Thoát</button>
  </div>
  <div class="opps" id="opponentsArea"></div>
  <div class="board">
    <div class="glog" id="gameLog"></div>
    <div class="pile disc" id="discardPile">🗑️</div>
    <div class="pile deck" id="deckPile" onclick="UI.onDrawClick()">
      🂠 <div class="badge-p" id="deckBadge">0</div>
    </div>
  </div>
  <div class="glass hand-area">
    <div class="hand-action-bar" id="handActionBar"></div>
    <div style="font-size:11px;font-weight:bold;color:var(--text-l);margin-bottom:4px;">Bài Trên Tay (<span id="uiHandCount">0</span>)</div>
    <div class="hand-scroll" id="handArea"></div>
  </div>
</div>

<div class="chat-ov" id="chatOverlay" onclick="UI.toggleChat()"></div>
<div class="chat-p" id="chatPanel">
  <div class="chat-h"><span>💬 Chat</span><span class="chat-x" onclick="UI.toggleChat()">✖</span></div>

<script>
// Bắt lỗi toàn cục để hiện Toast nếu có lỗi code
window.addEventListener('error', function(e) {
    console.error('[Global Error]', e.message);
    if(typeof UI !== 'undefined' && UI.toast) {
        UI.toast('Lỗi hệ thống: ' + e.message);
    } else {
        alert('Lỗi hệ thống: ' + e.message);
    }
});

/* ========== CARDS ========== */
const CARDS = {
  EK:{name:'Mèo Nổ',icon:'💥',class:'EK',desc:'Rút trúng = thua'},
  DEFUSE:{name:'Gỡ Bom',icon:'🧯',class:'DEFUSE',desc:'Cứu mạng khi nổ'},
  NOPE:{name:'Nope',icon:'🙅',class:'NOPE',desc:'Chặn hành động'},
  ATTACK:{name:'Tấn Công',icon:'⚔️',class:'ATTACK',desc:'Người sau +2 lượt'},
  SKIP:{name:'Bỏ Lượt',icon:'⏭️',class:'SKIP',desc:'Bỏ lượt, không rút'},
  SEE_FUTURE:{name:'Nhìn Trước',icon:'🔮',class:'SEE_FUTURE',desc:'Xem 3 lá trên'},
  SHUFFLE:{name:'Xáo Bài',icon:'🔀',class:'SHUFFLE',desc:'Xáo trộn bộ bài'},
  FAVOR:{name:'Xin Bài',icon:'🫴',class:'FAVOR',desc:'Xin 1 lá đối thủ'},
  CAT_TACO:{name:'Mèo Taco',icon:'🌮',class:'CAT',desc:'Combo 2+ cùng loại'},
  CAT_RAINBOW:{name:'Mèo Cầu Vồng',icon:'🌈',class:'CAT',desc:'Combo 2+ cùng loại'},
  CAT_BEARD:{name:'Mèo Râu',icon:'🧔',class:'CAT',desc:'Combo 2+ cùng loại'},
  CAT_POTATO:{name:'Mèo Khoai',icon:'🥔',class:'CAT',desc:'Combo 2+ cùng loại'},
  CAT_HAIRY:{name:'Mèo Lông',icon:'🐈',class:'CAT',desc:'Combo 2+ cùng loại'}
};
const CATS = ['CAT_TACO','CAT_RAINBOW','CAT_BEARD','CAT_POTATO','CAT_HAIRY'];
const NOPE_WINDOW = 3500;

const BOT_MODES = {
  normal:{label:'Bình thường',icon:'😴',playProb:0.55,nopeProb:0.05,catProb:0.4,skipProb:0.45,attackProb:0.55,smartTarget:false},
  smart:{label:'Thông minh',icon:'🧠',playProb:0.88,nopeProb:0.18,catProb:0.85,skipProb:0.6,attackProb:0.9,smartTarget:true},
  ultimate:{label:'Tối thượng',icon:'👑',playProb:1.0,nopeProb:0.35,catProb:1.0,skipProb:0.9,attackProb:1.0,smartTarget:true}
};

const BOT_NAMES = ['Mèo Béo','Mèo Ngáo','Mèo Điên','Mèo Lười','Mèo Ngu','Mèo Khôn','Mèo Bự'];

/* ========== UTILS ========== */
const U = {
  uid:()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),
  shuffle:a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  code:()=>String(Math.floor(Math.random()*1000000)).padStart(6,'0'),
  clone:o=>JSON.parse(JSON.stringify(o)),
  pick:arr=>arr[Math.floor(Math.random()*arr.length)]
};

const Sound = {
  ctx:null,
  init(){if(!this.ctx)try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},
  play(type){
    try{
      this.init();if(!this.ctx)return;
      if(this.ctx.state==='suspended')this.ctx.resume();
      const t=this.ctx.currentTime;
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.connect(g);g.connect(this.ctx.destination);
      const cfg={draw:{f:380,f2:620,d:.1,w:'sine',v:.08},play:{f:340,f2:120,d:.18,w:'triangle',v:.12},
        boom:{f:110,f2:25,d:.5,w:'sawtooth',v:.28},defuse:{f:700,f2:1200,d:.25,w:'sine',v:.15},
        nope:{f:220,f2:150,d:.15,w:'square',v:.12},win:{f:500,f2:800,d:.4,w:'sine',v:.2}}[type];
      if(!cfg)return;
      o.type=cfg.w;o.frequency.setValueAtTime(cfg.f,t);
      o.frequency.exponentialRampToValueAtTime(cfg.f2,t+cfg.d);
      g.gain.setValueAtTime(cfg.v,t);g.gain.exponentialRampToValueAtTime(.001,t+cfg.d);
      o.start(t);o.stop(t+cfg.d);
    }catch(e){}
  }
};

const VFX = {
  shake(){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500)},
  flash(){const el=document.getElementById('sc-game');el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),600)},
  explode(x,y){
    this.shake();this.flash();Sound.play('boom');
    for(let i=0;i<35;i++){
      const p=document.createElement('div');p.className='particle';
      const s=Math.random()*18+8;
      p.style.cssText=`width:${s}px;height:${s}px;left:${x}px;top:${y}px;background:hsl(${Math.random()*40},100%,55%)`;
      document.body.appendChild(p);
      const a=Math.random()*Math.PI*2,v=Math.random()*160+50;
      p.animate([{transform:'translate(0,0) scale(1)',opacity:1},
        {transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v}px) scale(0)`,opacity:0}],
        {duration:600+Math.random()*400,easing:'cubic-bezier(0,.9,.57,1)'}).onfinish=()=>p.remove();
    }
  }
};

/* ========== ENGINE ========== */
const Engine = {
  state:null, hostId:null, pendingTimer:null, onChange:null,

  createGame(players, hostId, botMode='smart'){
    this.hostId = hostId;
    this.state = {
      phase:'playing',
      players: players.map(p=>({
        id:p.id, name:p.name, isBot:!!p.isBot, hand:[], alive:true,
        stats:{turns:0, cardsPlayed:0, defuses:0}
      })),
      deck:[], discard:[], turnIdx:0, turnsLeft:1,
      pending:null, peekFor:null, awaitingChoice:null,
      winner:null, logs:[], lastDraw:null, botMode: botMode||'smart'
    };
    this.setupDeck();
    this.state.turnIdx = Math.floor(Math.random() * players.length);
    this.state.players[this.state.turnIdx].stats.turns = 1;
    this.log(`🎲 ${this.state.players[this.state.turnIdx].name} đi trước!`);
    this.notify();
  },

  setupDeck(){
    const n = this.state.players.length;
    const deck = this.state.deck;
    for(let i=0;i<4;i++) deck.push('ATTACK');
    for(let i=0;i<4;i++) deck.push('SKIP');
    for(let i=0;i<4;i++) deck.push('FAVOR');
    for(let i=0;i<4;i++) deck.push('SHUFFLE');
    for(let i=0;i<5;i++) deck.push('SEE_FUTURE');
    for(let i=0;i<5;i++) deck.push('NOPE');
    for(const c of CATS) for(let i=0;i<4;i++) deck.push(c);
    
    // GIẢM SỐ LƯỢNG GỠ BOM: Tổng tối đa 4 lá. Mỗi người cầm 1, số còn lại bỏ vào bài.
    let totalDefuse = 4;
    let deckDefuse = Math.max(0, totalDefuse - n); 
    for(let i=0;i<deckDefuse;i++) deck.push('DEFUSE');
    
    U.shuffle(deck);
    for(let i=0;i<7;i++) for(const p of this.state.players) p.hand.push(deck.pop());
    for(const p of this.state.players) p.hand.push('DEFUSE'); // Tặng 1 gỡ bom khởi đầu
    
    for(let i=0;i<n-1;i++) deck.push('EK');
    U.shuffle(deck);
  },

  cur(){return this.state.players[this.state.turnIdx]},
  byId(id){return this.state.players.find(p=>p.id===id)},
  alive(){return this.state.players.filter(p=>p.alive)},
  log(msg){this.state.logs.push(msg);if(this.state.logs.length>30)this.state.logs.shift()},
  notify(meta){if(this.onChange)this.onChange(meta)},

  endTurn(){
    this.state.pending=null;this.state.peekFor=null;clearTimeout(this.pendingTimer);
    let idx=this.state.turnIdx;
    do{idx=(idx+1)%this.state.players.length}while(!this.state.players[idx].alive);
    this.state.turnIdx=idx;this.state.turnsLeft=1;
    this.cur().stats.turns++;
    this.log(`→ Lượt của ${this.cur().name}`);
    this.notify({type:'turn'});
  },

  advanceTo(turns){
    this.state.pending=null;this.state.peekFor=null;clearTimeout(this.pendingTimer);
    let idx=this.state.turnIdx;
    do{idx=(idx+1)%this.state.players.length}while(!this.state.players[idx].alive);
    this.state.turnIdx=idx;this.state.turnsLeft=turns;
    this.cur().stats.turns++;
    this.log(`→ Lượt của ${this.cur().name} (${turns} lượt)`);
    this.notify({type:'turn'});
  },

  canAct(playerId, action){
    if(this.state.phase!=='playing') return false;
    const p=this.byId(playerId);
    if(!p||!p.alive) return false;
    if(action==='nope') return !!this.state.pending && p.hand.includes('NOPE');
    if(action==='clearPeek') return this.state.peekFor?.playerId===playerId;
    if(action==='defuse') return this.state.awaitingChoice?.type==='defuse' && this.state.awaitingChoice.playerId===playerId;
    if(action==='favor') return this.state.awaitingChoice?.type==='favor' && this.state.awaitingChoice.targetId===playerId;
    if(this.state.awaitingChoice) return false;
    if(this.state.pending) return false;
    if(this.cur().id!==playerId) return false;
    return true;
  },

  playCards(playerId, cardTypes, targetId, payload={}){
    if(!this.canAct(playerId,'play')) return false;
    const p = this.byId(playerId);
    const hand = [...p.hand];
    for(const c of cardTypes){
      const idx = hand.indexOf(c);
      if(idx===-1) return false;
      hand.splice(idx,1);
    }
    const primary = cardTypes[0];
    if(primary==='EK'||primary==='DEFUSE'||primary==='NOPE') return false;
    if(CATS.includes(primary)){
      if(cardTypes.length!==2 && cardTypes.length!==3) return false;
      if(!cardTypes.every(c=>c===primary)) return false;
      const t = this.byId(targetId);
      if(!t||!t.alive||t.id===playerId) return false;
    }
    if(primary==='FAVOR'){
      const t = this.byId(targetId);
      if(!t||!t.alive||t.id===playerId||t.hand.length===0) return false;
    }
    for(const c of cardTypes){
      p.hand.splice(p.hand.indexOf(c),1);
      this.state.discard.push(c);
    }
    p.stats.cardsPlayed += cardTypes.length;
    this.state.pending = {playerId, primary, cards:cardTypes, targetId, payload, nopeCount:0, timestamp:Date.now()};
    this.log(`${p.name} đánh ${CARDS[primary].name}${cardTypes.length>1?' ×'+cardTypes.length:''}`);
    this.scheduleResolve();
    this.notify({type:'play', playerId});
    return true;
  },

  scheduleResolve(){
    clearTimeout(this.pendingTimer);
    const pending = this.state.pending;
    this.pendingTimer = setTimeout(()=>{
      if(this.state.pending===pending) this.resolvePending();
    }, NOPE_WINDOW);
  },

  playNope(playerId){
    if(!this.state.pending) return false;
    const p = this.byId(playerId);
    if(!p||!p.alive||!p.hand.includes('NOPE')) return false;
    p.hand.splice(p.hand.indexOf('NOPE'),1);
    this.state.discard.push('NOPE');
    p.stats.cardsPlayed++;
    this.state.pending.nopeCount++;
    this.log(`${p.name} hô NOPE! (×${this.state.pending.nopeCount})`);
    Sound.play('nope');
    this.scheduleResolve();
    this.notify({type:'nope'});
    return true;
  },

  resolvePending(){
    clearTimeout(this.pendingTimer);
    const pending = this.state.pending;
    if(!pending) return;
    this.state.pending = null;
    if(pending.nopeCount % 2 === 1){
      this.log(`❌ Hành động bị NOPE hủy!`);
      this.notify({type:'resolve',cancelled:true});
      return;
    }
    const p = this.byId(pending.playerId);
    if(!p||!p.alive){this.notify({type:'resolve',cancelled:true});return;}

    switch(pending.primary){
      case 'ATTACK':{
        const nextTurns = this.state.turnsLeft + 1;
        this.log(`⚔️ ${p.name} tấn công! ${nextTurns} lượt cho người sau.`);
        this.advanceTo(nextTurns); return;
      }
      case 'SKIP':{
        this.state.turnsLeft--;
        this.log(`⏭️ ${p.name} bỏ lượt.`);
        if(this.state.turnsLeft<=0) this.endTurn();
        else this.notify({type:'resolve'});
        return;
      }
      case 'SHUFFLE':{
        U.shuffle(this.state.deck);
        this.log(`🔀 ${p.name} xáo bài.`);
        break;
      }
      case 'SEE_FUTURE':{
        const top=[];
        for(let i=0;i<3&&i<this.state.deck.length;i++) top.push(this.state.deck[this.state.deck.length-1-i]);
        this.state.peekFor = {playerId:pending.playerId, cards:top};
        this.log(`🔮 ${p.name} xem tương lai.`);
        break;
      }
      case 'FAVOR':{
        const t = this.byId(pending.targetId);
        if(t&&t.alive&&t.hand.length>0){
          this.log(`🫴 ${p.name} xin bài từ ${t.name}.`);
          this.state.awaitingChoice = {type:'favor', fromId:pending.playerId, targetId:t.id};
        }
        break;
      }
      default: if(CATS.includes(pending.primary)) this.doCatCombo(p,pending.targetId,pending.cards.length,pending.payload);
    }
    this.notify({type:'resolve'});
  },

  doCatCombo(p, targetId, count, payload){
    const t = this.byId(targetId);
    if(!t||!t.alive||t.hand.length===0) return;
    if(count===2){
      const idx = Math.floor(Math.random()*t.hand.length);
      const stolen = t.hand.splice(idx,1)[0];
      p.hand.unshift(stolen);
      this.log(`🐱 ${p.name} cướp 1 lá từ ${t.name}.`);
      Sound.play('draw');
    } else if(count===3){
      const wanted = payload.namedCard;
      if(!wanted) return;
      const idx = t.hand.indexOf(wanted);
      if(idx>-1){
        t.hand.splice(idx,1); p.hand.unshift(wanted);
        this.log(`🐱 ${p.name} lấy ${CARDS[wanted].name} từ ${t.name}.`);
        Sound.play('draw');
      } else {
        this.log(`🐱 ${t.name} không có ${CARDS[wanted].name}.`);
      }
    }
  },

  drawCard(playerId){
    if(!this.canAct(playerId,'draw')) return false;
    const p = this.byId(playerId);
    if(this.state.deck.length===0){
      this.log(`Bộ bài trống, ${p.name} không rút được.`);
      this.endTurn(); return true;
    }
    const card = this.state.deck.pop();
    Sound.play('draw');
    this.log(`${p.name} rút 1 lá...`);
    if(card==='EK') this.handleEK(p);
    else {
      p.hand.unshift(card);
      this.state.lastDraw = {playerId:p.id, card, id:Math.random()};
      this.state.turnsLeft--;
      if(this.state.turnsLeft<=0) this.endTurn();
      else this.notify({type:'draw'});
    }
    return true;
  },

  handleEK(p){
    this.state.discard.push('EK');
    this.log(`💥 ${p.name} rút trúng MÈO NỔ!`);
    const defIdx = p.hand.indexOf('DEFUSE');
    if(defIdx===-1){
      p.alive = false;
      this.state.discard.push(...p.hand);
      p.hand = [];
      this.log(`☠️ ${p.name} BỊ LOẠI!`);
      if(this.checkWin()) return;
      this.state.turnsLeft = 0;
      this.endTurn();
    } else {
      p.hand.splice(defIdx,1);
      p.stats.defuses++;
      this.state.discard.push('DEFUSE');
      this.log(`🧯 ${p.name} dùng DEFUSE!`);
      Sound.play('defuse');
      this.state.awaitingChoice = {type:'defuse', playerId:p.id};
      this.notify({type:'defuse-prompt', playerId:p.id});
    }
  },

  placeDefuse(playerId, pos){
    if(!this.state.awaitingChoice||this.state.awaitingChoice.type!=='defuse') return false;
    if(this.state.awaitingChoice.playerId!==playerId) return false;
    let idx;
    if(pos==='top') idx = this.state.deck.length;
    else if(pos==='bottom') idx = 0;
    else if(typeof pos==='number') idx = Math.max(0,Math.min(this.state.deck.length,pos));
    else idx = Math.floor(Math.random()*(this.state.deck.length+1));
    this.state.deck.splice(idx,0,'EK');
    this.state.awaitingChoice = null;
    this.log(`Bom được giấu lại.`);
    this.state.turnsLeft--;
    if(this.state.turnsLeft<=0) this.endTurn();
    else this.notify({type:'defuse-done'});
    return true;
  },

  resolveFavor(targetId, cardIdx){
    if(!this.state.awaitingChoice||this.state.awaitingChoice.type!=='favor') return false;
    const {fromId, targetId:expectedTarget} = this.state.awaitingChoice;
    if(targetId!==expectedTarget) return false;
    const target = this.byId(targetId);
    const from = this.byId(fromId);
    if(!target||!from) return false;
    if(cardIdx<0||cardIdx>=target.hand.length) return false;
    const card = target.hand.splice(cardIdx,1)[0];
    from.hand.unshift(card);
    this.log(`🫴 ${from.name} nhận ${CARDS[card].name} từ ${target.name}.`);
    this.state.awaitingChoice = null;
    this.notify({type:'favor-done'});
    return true;
  },

  clearPeek(playerId){
    if(this.state.peekFor?.playerId!==playerId) return false;
    this.state.peekFor = null;
    this.notify({type:'peek-cleared'});
    return true;
  },

  checkWin(){
    const alive = this.alive();
    if(alive.length<=1){
      this.state.phase = 'ended';
      this.state.winner = alive[0] || null;
      this.state.awaitingChoice = null;
      this.state.pending = null;
      clearTimeout(this.pendingTimer);
      if(alive[0]) this.log(`🏆 ${alive[0].name} CHIẾN THẮNG!`);
      Sound.play('win');
      this.notify({type:'win', winner:this.state.winner});
      return true;
    }
    return false;
  }
};

/* ========== NET (PEERJS P2P - FIXED) ========== */
const Net = {
  peer: null,
  conn: null, 
  conns: [], 
  isHost: false,
  roomCode: null,
  onHostReady:null, onClientDisconnect:null, onJoin:null, onAction:null, onChat:null, onState:null, onLobby:null, onStart:null, onHostLeft:null, onError:null,

  host(code){
    this.roomCode = code; 
    this.isHost = true;
    
    if (typeof Peer === 'undefined') {
      if (this.onError) this.onError('Lỗi: Thư viện mạng chưa tải xong. Vui lòng tải lại trang.');
      return;
    }

    try {
      this.peer = new Peer('ek_room_' + code, {
        config: {'iceServers': [
          { url: 'stun:stun.l.google.com:19302' },
          { url: 'stun:stun1.l.google.com:19302' },
          { url: 'stun:stun2.l.google.com:19302' }
        ]}
      });
    } catch(e) {
      if (this.onError) this.onError('Lỗi khởi tạo: ' + e.message);
      return;
    }

    // Timeout 10s nếu không kết nối được tới Server
    const timeout = setTimeout(() => {
        if (this.peer && !this.peer.destroyed && !this.peer.open) {
            this.peer.destroy();
            if (this.onError) this.onError('Máy chủ kết nối quá tải. Vui lòng thử lại!');
        }
    }, 10000);

    this.peer.on('open', () => {
      clearTimeout(timeout);
      if (this.onHostReady) this.onHostReady();
    });

    this.peer.on('connection', (c) => {
      this.conns.push(c);
      c.on('data', (data) => this.route(data, c));
      c.on('close', () => {
        this.conns = this.conns.filter(x => x !== c);
        if (this.onClientDisconnect) this.onClientDisconnect(c);
      });
    });

    this.peer.on('error', (err) => {
      clearTimeout(timeout);
      if(this.onError) this.onError('Lỗi máy chủ: ' + err.type);
    });
  },

  join(code){
    this.roomCode = code; 
    this.isHost = false;

    if (typeof Peer === 'undefined') {
      if (this.onError) this.onError('Lỗi: Thư viện mạng chưa tải xong. Vui lòng tải lại trang.');
      return;
    }

    try {
      this.peer = new Peer({
        config: {'iceServers': [
          { url: 'stun:stun.l.google.com:19302' },
          { url: 'stun:stun1.l.google.com:19302' },
          { url: 'stun:stun2.l.google.com:19302' }
        ]}
      });
    } catch(e) {
      if (this.onError) this.onError('Lỗi khởi tạo: ' + e.message);
      return;
    }
    
    const timeout = setTimeout(() => {
        if (this.peer && !this.peer.destroyed && !this.peer.open) {
            this.peer.destroy();
            if (this.onError) this.onError('Máy chủ kết nối quá tải. Vui lòng thử lại!');
        }
    }, 10000);

    this.peer.on('open', () => {
      clearTimeout(timeout);
      this.conn = this.peer.connect('ek_room_' + code, { reliable: true });
      
      this.conn.on('open', () => {
        if(this.onConnectSuccess) this.onConnectSuccess();
      });
      this.conn.on('data', (data) => this.route(data));
      this.conn.on('close', () => {
        if(this.onHostLeft) this.onHostLeft();
      });
      this.conn.on('error', (err) => {
        if(this.onError) this.onError('Lỗi đường truyền. Vui lòng thử lại.');
      });
    });

    this.peer.on('error', (err) => {
      clearTimeout(timeout);
      if(err.type === 'peer-unavailable') {
        if(this.onError) this.onError('Không tìm thấy phòng ' + code);
      } else {
        if(this.onError) this.onError('Lỗi kết nối mạng: ' + err.type);
      }
    });
  },

  close(){
    if(this.conn) try{this.conn.close()}catch(e){}
    if(this.conns) this.conns.forEach(c => try{c.close()}catch(e){});
    if(this.peer) try{this.peer.destroy()}catch(e){}
    this.conn = null; this.conns = []; this.peer = null;
  },

  send(msg, targetConn = null){
    if(this.isHost){
      if(targetConn){
        if(targetConn.open) targetConn.send(msg);
      } else {
        this.conns.forEach(c => { if(c.open) c.send(msg) });
      }
    } else {
      if(this.conn && this.conn.open) this.conn.send(msg);
    }
  },

  route(msg, conn){
    if(!msg||!msg.type) return;
    if(this.isHost){
      switch(msg.type){
        case 'join': 
          if(this.onJoin) this.onJoin(msg.player, conn); 
          break;
        case 'action': 
          if(this.onAction) this.onAction(msg.playerId, msg.action, msg.payload); 
          break;
        case 'chat': 
          if(this.onChat) this.onChat(msg.name, msg.text); 
          this.send({type:'chat', name:msg.name, text:msg.text}); 
          break;
      }
    } else {
      switch(msg.type){
        case 'lobby': if(this.onLobby) this.onLobby(msg.players); break;
        case 'state': if(this.onState) this.onState(msg.state); break;
        case 'start': if(this.onStart) this.onStart(msg.state); break;
        case 'chat': if(this.onChat) this.onChat(msg.name, msg.text); break;
        case 'host_left': if(this.onHostLeft) this.onHostLeft(); break;
        case 'error': if(this.onError) this.onError(msg.message); break;
      }
    }
  }
};

/* ========== UI ========== */
const UI = {
  myId:null, roomCode:null, isHost:false,
  lobbyPlayers:[], botScheduled:false,
  currentModal:null, _animatedDrawId:null,
  selectedCatIndices:[], pendingCatPlay:null, _handSig:'',
  isShuffling:false,

  init(){
    this.myId = 'p_' + U.uid();
    let savedName = null;
    try{savedName = sessionStorage.getItem('ek_name')}catch(e){}
    if(!savedName) savedName = 'Player_' + Math.floor(Math.random()*1000);
    document.getElementById('playerName').value = savedName;
    Engine.onChange = (meta) => this.onEngineChange(meta);
  },

  showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
    document.getElementById(id).classList.add('on');
  },
  toast(msg){
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  },
  copyCode(){
    try{navigator.clipboard.writeText(this.roomCode);this.toast('✅ Đã copy mã phòng')}
    catch(e){this.toast('Mã phòng: ' + this.roomCode)}
  },
  getMyName(){
    const v = document.getElementById('playerName').value.trim() || 'Player';
    try{sessionStorage.setItem('ek_name', v)}catch(e){}
    return v;
  },
  me(){return Engine.state?.players.find(p => p.id === this.myId)},

  /* ---------- CREATE ROOM ---------- */
  createRoom(){
    try {
      const btn = document.getElementById('btnCreateRoom');
      if(btn) btn.disabled = true;

      this.roomCode = U.code();
      this.isHost = true;
      this.lobbyPlayers = [{ id:this.myId, name:this.getMyName(), isHost:true, isBot:false }];
      
      // Chuyển màn hình ngay lập tức
      this.showScreen('sc-lobby');
      document.getElementById('lobbyCode').innerText = this.roomCode;
      document.getElementById('lobbyStatus').innerHTML = '<span class="connecting"></span>Đang kết nối tới máy chủ mạng...';
      document.getElementById('hostControls').style.display = 'flex';
      document.getElementById('btnStart').style.display = 'block';
      this.renderLobby();

      // Delay nhỏ để UI kịp render trước khi khởi tạo mạng
      setTimeout(() => {
        this.setupNet(true);
      }, 100);
    } catch (e) {
      this.toast('Lỗi: ' + e.message);
      const btn = document.getElementById('btnCreateRoom');
      if(btn) btn.disabled = false;
    }
  },

  /* ---------- JOIN ROOM ---------- */
  joinRoom(){
    try {
      const raw = document.getElementById('joinCode').value.trim();
      if(!/^\d{6}$/.test(raw)) return this.toast('Mã phòng phải là 6 chữ số');

      const btn = document.getElementById('btnJoinRoom');
      if(btn) btn.disabled = true;

      this.roomCode = raw;
      this.isHost = false;
      this.lobbyPlayers = [];

      this.showScreen('sc-lobby');
      document.getElementById('lobbyCode').innerText = this.roomCode;
      document.getElementById('lobbyStatus').innerHTML = '<span class="connecting"></span>Đang kết nối tới phòng...';
      document.getElementById('hostControls').style.display = 'none';
      document.getElementById('btnStart').style.display = 'none';
      this.renderLobby();

      setTimeout(() => {
        this.setupNet(false);
      }, 100);
    } catch (e) {
      this.toast('Lỗi: ' + e.message);
      const btn = document.getElementById('btnJoinRoom');
      if(btn) btn.disabled = false;
    }
  },

  setupNet(host){
    if(Net.peer) Net.close();
    
    if(host){
      Net.onHostReady = () => {
        document.getElementById('lobbyStatus').innerHTML = '✅ Phòng đã sẵn sàng · Chia sẻ mã cho bạn bè';
      };
      
      Net.onError = (msg) => {
        this.toast(msg);
        document.getElementById('lobbyStatus').innerHTML = '⚠️ <span style="color:red">' + msg + '</span>';
      };

      Net.onJoin = (player, conn) => {
        if(this.lobbyPlayers.some(p => p.id === player.id)) {
            Net.send({ type:'error', message:'ID trùng lặp!' }, conn);
            return;
        }
        if(this.lobbyPlayers.length >= 6) {
            Net.send({ type:'error', message:'Phòng đã đầy!' }, conn);
            return;
        }
        player.conn = conn; 
        this.lobbyPlayers.push(player);
        this.broadcastLobby();
        this.renderLobby();
      };

      Net.onClientDisconnect = (conn) => {
         const idx = this.lobbyPlayers.findIndex(p => p.conn === conn);
         if (idx > -1) {
             this.lobbyPlayers.splice(idx, 1);
             this.broadcastLobby();
             this.renderLobby();
         }
      };

      Net.onAction = (pid, action, payload) => {
        try{ this.hostAction(pid, action, payload); }
        catch(e){ console.error('[EK] hostAction:', e); }
      };
      
      Net.onChat = (name, text) => this.addChatMsg(name, text);

      Net.host(this.roomCode);

    } else {
      Net.onConnectSuccess = () => {
        Net.send({ type:'join', player: { id:this.myId, name:this.getMyName() } });
      };

      Net.onError = (msg) => {
        this.toast(msg);
        document.getElementById('lobbyStatus').innerHTML = '⚠️ <span style="color:red">' + msg + '</span>';
      };

      Net.onLobby = (players) => {
        this.lobbyPlayers = players;
        this.renderLobby();
        document.getElementById('lobbyStatus').innerHTML = '✅ Đã kết nối · Nhấn mã để copy';
      };
      
      Net.onStart = (state) => { 
        Engine.state = state; 
        this.enterGame(false); 
      };
      
      Net.onState = (state) => { 
        Engine.state = state; 
        this.render(); 
        this.updateModals(); 
      };
      
      Net.onChat = (name, text) => this.addChatMsg(name, text);
      
      Net.onHostLeft = () => {
        this.toast('Chủ phòng đã rời đi!');
        setTimeout(() => this.leaveRoom(), 1000);
      };

      Net.join(this.roomCode);
    }
  },

  broadcastLobby(){ 
    if(this.isHost) {
        const safePlayers = this.lobbyPlayers.map(p => ({id:p.id, name:p.name, isBot:p.isBot, isHost:p.isHost}));
        Net.send({ type:'lobby', players: safePlayers }); 
    }
  },

  renderLobby(){
    const box = document.getElementById('lobbyPlayers');
    if(this.lobbyPlayers.length === 0){
      box.innerHTML = '<div class="plist-empty">Đang chờ kết nối...</div>';
      return;
    }
    box.innerHTML = this.lobbyPlayers.map(p => `
      <div class="pitem">
        <div class="av">${p.isBot?'🤖':'👤'}</div>
        <div class="nm">${this.escapeHtml(p.name)}${p.id===this.myId?' (bạn)':''}</div>
        <div class="st">${p.isHost?'Host':(p.isBot?'Bot':'Sẵn sàng')}</div>
      </div>
    `).join('');
  },

  addBot(){
    if(this.lobbyPlayers.length >= 6) return this.toast('Tối đa 6 người');
    this.lobbyPlayers.push({
      id:'bot_'+U.uid(),
      name: U.pick(BOT_NAMES) + ' ' + this.lobbyPlayers.length,
      isBot:true, isHost:false
    });
    this.broadcastLobby();
    this.renderLobby();
  },

  removeBot(){
    const botIdx = this.lobbyPlayers.findIndex(p => p.isBot);
    if(botIdx > -1){
        this.lobbyPlayers.splice(botIdx, 1);
        this.broadcastLobby();
        this.renderLobby();
    } else {
        this.toast('Không có Bot nào để xóa');
    }
  },

  /* ---------- START GAME ---------- */
  startSolo(){
    this.isHost = true;
    this.myId = 'p_' + U.uid(); // Reset ID cho solo
    const total = parseInt(document.getElementById('soloPlayerCount').value) || 3;
    const botMode = document.getElementById('botMode').value || 'smart';
    const players = [{ id:this.myId, name:this.getMyName(), isBot:false }];
    const usedNames = [];
    for(let i = 1; i < total; i++){
      let name = BOT_NAMES[i % BOT_NAMES.length];
      while(usedNames.includes(name)) name = name + i;
      usedNames.push(name);
      players.push({ id:'bot_'+i, name, isBot:true });
    }
    Engine.createGame(players, this.myId, botMode);
    this.enterGame(true);
  },

  startMultiplayerGame(){
    if(this.lobbyPlayers.length < 2) return this.toast('Cần ít nhất 2 người!');
    const botMode = document.getElementById('lobbyBotMode')?.value || 'smart';
    const players = this.lobbyPlayers.map(p => ({ id:p.id, name:p.name, isBot:p.isBot }));
    
    Engine.createGame(players, this.myId, botMode);
    Net.send({ type:'start', state: U.clone(Engine.state) });
    this.enterGame(true);
  },

  enterGame(asHost){
    this.isHost = asHost;
    this.showScreen('sc-game');
    document.getElementById('chatFab').classList.add('on');
    this.render();
    this.updateModals();
    if(asHost) this.processBots();
  },

  leaveRoom(){
    if(Net.peer){
      if(this.isHost) Net.send({type:'host_left'});
      Net.close();
    }
    Engine.state = null;
    this.isHost = false;
    this.roomCode = null;
    this.lobbyPlayers = [];
    this.selectedCatIndices = [];
    this.pendingCatPlay = null;
    this.botScheduled = false;
    document.getElementById('chatFab').classList.remove('on');
    this.closeModal();
    this.showScreen('sc-home');
    
    // Mở khóa nút
    const btnC = document.getElementById('btnCreateRoom');
    if(btnC) btnC.disabled = false;
    const btnJ = document.getElementById('btnJoinRoom');
    if(btnJ) btnJ.disabled = false;
  },

  /* ---------- ACTIONS ---------- */
  act(action, payload = {}){
    if(!Engine.state) return;
    if(this.isHost) {
        this.hostAction(this.myId, action, payload);
    } else {
        Net.send({ type:'action', playerId:this.myId, action, payload });
    }
  },

  hostAction(playerId, action, payload){
    let ok = false;
    try{
      switch(action){
        case 'play': ok = Engine.playCards(playerId, payload.cards, payload.targetId, payload.extra||{}); break;
        case 'draw': ok = Engine.drawCard(playerId); break;
        case 'nope': ok = Engine.playNope(playerId); break;
        case 'defuse': ok = Engine.placeDefuse(playerId, payload.pos); break;
        case 'favor': ok = Engine.resolveFavor(playerId, payload.idx); break;
        case 'clearPeek': ok = Engine.clearPeek(playerId); break;
      }
    }catch(e){ console.error('[EK] Engine error:', e); }
    if(!ok && this.isHost) Net.send({ type:'state', state: U.clone(Engine.state) });
  },

  onEngineChange(){
    const me = this.me();
    const sig = me ? me.hand.join('|') : '';
    if(sig !== this._handSig){
      this.selectedCatIndices = [];
      this._handSig = sig;
    }
    if(this.isHost) Net.send({ type:'state', state: U.clone(Engine.state) });
    this.render();
    this.updateModals();
    this.renderVFX();
    if(this.isHost) this.processBots();
  },

  renderVFX(){
    const s = Engine.state; if(!s) return;
    const lastLog = s.logs[s.logs.length-1] || '';
    
    if(lastLog.includes('MÈO NỔ')){
      const deck = document.getElementById('deckPile');
      if(deck){
        const r = deck.getBoundingClientRect();
        setTimeout(() => VFX.explode(r.left + r.width/2, r.top + r.height/2), 100);
      }
    }
    
    if(lastLog.includes('xáo bài')){
        if(!this.isShuffling){
            this.isShuffling = true;
            const deck = document.getElementById('deckPile');
            if(deck){
                deck.classList.add('shuffling');
                setTimeout(() => {
                    deck.classList.remove('shuffling');
                    this.isShuffling = false;
                }, 800);
            }
        }
    }
  },

  /* ---------- BOT LOGIC ---------- */
  processBots(){
    if(!this.isHost || this.botScheduled) return;
    const s = Engine.state;
    if(!s || s.phase !== 'playing') return;

    if(s.awaitingChoice){
      const p = Engine.byId(s.awaitingChoice.playerId || s.awaitingChoice.targetId);
      if(p?.isBot){
        this.botScheduled = true;
        setTimeout(() => {
          this.botScheduled = false;
          const ch = Engine.state.awaitingChoice;
          if(!ch) return;
          if(ch.type==='defuse' && ch.playerId===p.id){
            const pos = Math.random()<0.3 ? 'top' : (Math.random()<0.5 ? 'random' : 'bottom');
            Engine.placeDefuse(p.id, pos);
          } else if(ch.type==='favor' && ch.targetId===p.id){
            Engine.resolveFavor(p.id, Math.floor(Math.random()*p.hand.length));
          }
        }, 1200);
        return;
      }
      return;
    }

    if(s.pending){
      this.botScheduled = true;
      setTimeout(() => { this.botScheduled = false; this.botNopeCheck(); }, 800);
      return;
    }

    if(Engine.cur()?.isBot){
      this.botScheduled = true;
      setTimeout(() => { this.botScheduled = false; this.runBotTurn(); }, 1400);
    }
  },

  botNopeCheck(){
    const s = Engine.state;
    if(!s || !s.pending) return;
    const pending = s.pending;
    const mode = BOT_MODES[s.botMode] || BOT_MODES.smart;
    for(const p of s.players){
      if(!p.isBot || !p.alive || !p.hand.includes('NOPE')) continue;
      if(p.id===pending.playerId && pending.nopeCount===0) continue;
      let prob = mode.nopeProb;
      const isTarget = pending.targetId === p.id;
      if(pending.primary==='ATTACK') prob *= 1.5;
      if(pending.primary==='FAVOR' && isTarget) prob = Math.min(0.95, prob*3);
      if(CATS.includes(pending.primary) && isTarget) prob = Math.min(0.9, prob*2.5);
      if(pending.nopeCount>0) prob *= 0.6;
      if(Math.random()<prob){ Engine.playNope(p.id); return; }
    }
  },

  runBotTurn(){
    const s = Engine.state;
    if(!s || s.phase!=='playing') return;
    const bot = Engine.cur();
    if(!bot?.isBot) return;
    const mode = BOT_MODES[s.botMode] || BOT_MODES.smart;
    const hand = bot.hand;
    const has = c => hand.includes(c);
    const cnt = c => hand.filter(x => x === c).length;
    const opponents = s.players.filter(p => p.alive && p.id !== bot.id);

    if(Math.random() > mode.playProb) return Engine.drawCard(bot.id);

    let target = null;
    if(opponents.length){
      if(mode.smartTarget){
        const withCards = opponents.filter(o=>o.hand.length>0);
        target = withCards.length
          ? withCards.reduce((a,b)=>a.hand.length < b.hand.length ? a : b)
          : U.pick(opponents);
      } else target = U.pick(opponents);
    }

    if(s.turnsLeft >= 2 && has('ATTACK') && Math.random() < mode.attackProb)
      return this.botPlay(['ATTACK']);

    for(const cat of CATS){
      if(cnt(cat)>=3 && target && target.hand.length>0 && Math.random() < mode.catProb){
        const named = U.pick(['SKIP','ATTACK','NOPE','FAVOR','SEE_FUTURE','SHUFFLE',...CATS]);
        return this.botPlay([cat,cat,cat], target.id, { namedCard:named });
      }
    }
    for(const cat of CATS){
      if(cnt(cat)>=2 && target && target.hand.length>0 && Math.random() < mode.catProb){
        return this.botPlay([cat,cat], target.id);
      }
    }

    if(has('FAVOR') && target && target.hand.length>=2 && Math.random() < mode.catProb)
      return this.botPlay(['FAVOR'], target.id);

    if(has('SKIP') && Math.random() < mode.skipProb)
      return this.botPlay(['SKIP']);

    if(mode===BOT_MODES.ultimate && has('SEE_FUTURE') && Math.random()<0.4)
      return this.botPlay(['SEE_FUTURE']);

    Engine.drawCard(bot.id);
  },

  botPlay(cards, targetId, extra){
    Engine.playCards(Engine.cur().id, cards, targetId||null, extra||{});
  },

  /* ---------- RENDER ---------- */
  render(){
    const s = Engine.state; if(!s) return;
    const me = this.me(); if(!me) return;

    document.getElementById('uiAlive').innerText = s.players.filter(p => p.alive).length;
    document.getElementById('uiDeck').innerText = s.deck.length;
    document.getElementById('deckBadge').innerText = s.deck.length;
    document.getElementById('uiHandCount').innerText = me.hand.length;

    const cur = s.players[s.turnIdx];
    const modeInfo = s.botMode ? ` · ${BOT_MODES[s.botMode].icon}` : '';
    document.getElementById('uiTurn').innerHTML = s.phase==='ended' ? 'Kết thúc' : `Lượt: ${this.escapeHtml(cur.name)}${modeInfo}`;

    const turnsEl = document.getElementById('uiTurnsLeft');
    if(s.turnsLeft > 1){ turnsEl.style.display = 'inline-block'; turnsEl.innerText = `×${s.turnsLeft}`; }
    else turnsEl.style.display = 'none';

    document.getElementById('opponentsArea').innerHTML = s.players.filter(p => p.id !== me.id)
      .map(p => `
        <div class="glass opp ${cur.id===p.id?'turn':''} ${!p.alive?'dead':''}">
          <div class="av">${p.isBot?'🤖':'👤'}</div>
          <div class="nm">${this.escapeHtml(p.name)}</div>
          <div class="cnt">🂠 ${p.hand.length}</div>
        </div>
      `).join('');

    const disc = document.getElementById('discardPile');
    if(s.discard.length > 0){
      const top = s.discard[s.discard.length-1];
      disc.innerHTML = `<div style="font-size:38px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))">${CARDS[top].icon}</div>`;
    } else disc.innerHTML = '🗑️';

    const myTurn = cur.id === me.id && s.phase === 'playing';
    const canPlay = myTurn && !s.pending && !s.awaitingChoice;
    const deckEl = document.getElementById('deckPile');
    deckEl.classList.toggle('can', canPlay);
    deckEl.classList.toggle('locked', !canPlay);

    let newDrawIdx = -1;
    if(s.lastDraw && s.lastDraw.playerId === me.id && s.lastDraw.id !== this._animatedDrawId){
      this._animatedDrawId = s.lastDraw.id;
      newDrawIdx = 0;
    }

    const handBox = document.getElementById('handArea');
    handBox.innerHTML = [...me.hand].map((c, idx) => {
      const card = CARDS[c];
      const playable = canPlay && c!=='EK' && c!=='DEFUSE' && c!=='NOPE'
        && (CATS.includes(c) ? me.hand.filter(x => x===c).length>=2 : true);
      const isNew = idx === newDrawIdx;
      const isSelected = this.selectedCatIndices.includes(idx);
      return `
        <div class="card c-${card.class} ${playable?'':'dis'} ${isNew?'new-draw':''} ${isSelected?'selected':''}"
          onclick="UI.clickCard('${c}', ${idx})">
          <div class="ic">${card.icon}</div>
          <div class="tt">${card.name}</div>
          <div class="ds">${card.desc||''}</div>
        </div>
      `;
    }).join('');

    this.renderHandActionBar();
    document.getElementById('gameLog').innerHTML = s.logs.slice(-4).map(l => `• ${this.escapeHtml(l)}`).join('<br>');
    this.updateNopeButton();
  },

  renderHandActionBar(){
    const bar = document.getElementById('handActionBar');
    const n = this.selectedCatIndices.length;
    if(n < 2){ bar.classList.remove('on'); bar.innerHTML = ''; return; }
    const me = this.me();
    if(!me){ bar.classList.remove('on'); return; }
    const card = me.hand[this.selectedCatIndices[0]];
    const totalOfType = me.hand.filter(c => c === card).length;
    bar.classList.add('on');
    bar.innerHTML = `
      <span>Đã chọn <b>${n}</b> lá ${CARDS[card].icon} ${CARDS[card].name}</span>
      <button class="btn-p" onclick="UI.confirmCatSelection()">Chơi ${n} lá</button>
      ${n===2 && totalOfType>=3 ? '<span style="font-size:10px;color:#666">(click thêm 1 lá để chơi 3)</span>' : ''}
      <button class="btn-o" onclick="UI.cancelCatSelection()">Huỷ</button>
    `;
  },

  updateNopeButton(){
    const s = Engine.state;
    const me = this.me();
    let btn = document.getElementById('nopeBtn');
    const show = s && me && me.alive && s.pending && s.pending.playerId !== me.id && me.hand.includes('NOPE');
    if(show){
      if(!btn){
        btn = document.createElement('button');
        btn.id = 'nopeBtn';
        btn.className = 'nope-btn';
        btn.innerText = '🙅 NOPE!';
        btn.onclick = () => this.act('nope');
        document.body.appendChild(btn);
      }
    } else if(btn) btn.remove();
  },

  /* ---------- MODALS ---------- */
  openModal(type, html){
    this.currentModal = type;
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('overlayModal').classList.add('on');
  },
  closeModal(){
    this.currentModal = null;
    document.getElementById('overlayModal').classList.remove('on');
  },

  updateModals(){
    const s = Engine.state; if(!s) return;
    const me = this.me(); if(!me) return;

    if(s.awaitingChoice?.type==='defuse' && s.awaitingChoice.playerId===this.myId){
      if(this.currentModal!=='defuse') this.showDefuseModal();
      return;
    }
    if(s.awaitingChoice?.type==='favor' && s.awaitingChoice.targetId===this.myId){
      if(this.currentModal!=='favor') this.showFavorModal();
      return;
    }
    if(s.peekFor?.playerId===this.myId && !s.pending){
      if(this.currentModal!=='peek') this.showPeekModal(s.peekFor.cards);
      return;
    }
    if(['defuse','favor','peek'].includes(this.currentModal)) this.closeModal();
    if(s.phase==='ended' && this.currentModal!=='win') this.showWinModal();
  },

  showDefuseModal(){
    this.openModal('defuse', `
      <h2>🧯 Bạn đã dùng DEFUSE!</h2>
      <p>Chọn vị trí giấu lại Mèo Nổ:</p>
      <div class="mcol">
        <button class="btn-d" onclick="UI.act('defuse',{pos:'top'}); UI.closeModal();">⬆️ Trên cùng (nguy hiểm)</button>
        <button onclick="UI.act('defuse',{pos:'random'}); UI.closeModal();">🎲 Ngẫu nhiên</button>
        <button class="btn-p" onclick="UI.act('defuse',{pos:'bottom'}); UI.closeModal();">⬇️ Dưới cùng (an toàn)</button>
      </div>
    `);
  },

  showFavorModal(){
    const me = this.me();
    const s = Engine.state;
    const requester = s.players.find(p => p.id === s.awaitingChoice.fromId);
    this.openModal('favor', `
      <h2>🫴 ${this.escapeHtml(requester?.name||'Ai đó')} xin bài!</h2>
      <p>Chọn 1 lá để đưa:</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">
        ${me.hand.map((c,i) => `
          <div class="card c-${CARDS[c].class}" onclick="UI.act('favor',{idx:${i}}); UI.closeModal();">
            <div class="ic">${CARDS[c].icon}</div>
            <div class="tt">${CARDS[c].name}</div>
            <div class="ds">${CARDS[c].desc||''}</div>
          </div>
        `).join('')}
      </div>
    `);
  },

  showPeekModal(cards){
    this.openModal('peek', `
      <h2>🔮 Nhìn Tương Lai</h2>
      <p>3 lá trên cùng (thứ tự rút):</p>
      <div style="display:flex;gap:10px;justify-content:center;margin:15px 0;">
        ${cards.map(c => `
          <div class="card c-${CARDS[c].class}" style="width:76px;height:106px">
            <div class="ic">${CARDS[c].icon}</div>
            <div class="tt">${CARDS[c].name}</div>
            <div class="ds">${CARDS[c].desc||''}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn-p" onclick="UI.act('clearPeek'); UI.closeModal();">Đã Hiểu</button>
    `);
  },

  showWinModal(){
    const s = Engine.state;
    const w = s.winner;
    const rows = [...s.players].sort((a,b) => (a.alive===b.alive)?0:(a.alive?-1:1)).map(p => `
      <div class="stat-row">
        <span>${p.alive?'🏆':'💀'} ${this.escapeHtml(p.name)}</span>
        <span>${p.stats.turns} lượt · ${p.stats.cardsPlayed} lá</span>
      </div>
    `).join('');
    this.openModal('win', `
      <h1 style="color:var(--red);font-size:36px;">🎉 CHIẾN THẮNG!</h1>
      <div style="font-size:70px;margin:10px 0;">🏆</div>
      <h2>${this.escapeHtml(w?.name||'Không ai')}</h2>
      <div style="text-align:left;margin:15px 0;">${rows}</div>
      <button class="btn-p" onclick="UI.leaveRoom()">Về Trang Chủ</button>
    `);
  },

  /* ---------- CLICKS ---------- */
  clickCard(card, idx){
    const s = Engine.state;
    if(!s || s.phase!=='playing') return;
    const me = this.me(); if(!me) return;
    if(s.pending || s.awaitingChoice) return this.toast('Đang chờ hành động...');
    if(s.players[s.turnIdx].id !== me.id) return this.toast('Chưa đến lượt');
    if(!me.alive) return;

    if(CATS.includes(card)) return this.toggleCatSelection(card, idx);

    this.selectedCatIndices = [];

    if(card === 'FAVOR'){
      const targets = s.players.filter(p => p.alive && p.id !== me.id && p.hand.length > 0);
      if(targets.length === 0) return this.toast('Không có ai để xin');
      this.openModal('target', `
        <h2>🫴 Xin bài từ ai?</h2>
        <div class="mcol">
          ${targets.map(t => `<button onclick="UI.act('play',{cards:['FAVOR'],targetId:'${t.id}'}); UI.closeModal();">${this.escapeHtml(t.name)} (${t.hand.length} lá)</button>`).join('')}
        </div>
        <button class="btn-o" onclick="UI.closeModal()">Hủy</button>
      `);
      return;
    }
    if(['ATTACK','SKIP','SHUFFLE','SEE_FUTURE'].includes(card)){
      this.act('play', { cards:[card] });
      return;
    }
    this.toast('Không thể đánh lá này trực tiếp');
  },

  toggleCatSelection(card, idx){
    const me = this.me();
    if(this.selectedCatIndices.length > 0){
      const firstType = me.hand[this.selectedCatIndices[0]];
      if(firstType !== card){
        this.selectedCatIndices = [idx];
        this.render();
        return;
      }
    }
    if(this.selectedCatIndices.includes(idx)){
      this.selectedCatIndices = this.selectedCatIndices.filter(i => i !== idx);
      this.render();
      return;
    }
    if(this.selectedCatIndices.length >= 3) return;
    this.selectedCatIndices.push(idx);
    this.selectedCatIndices.sort((a,b) => a-b);
    this.render();
  },

  cancelCatSelection(){
    this.selectedCatIndices = [];
    this.pendingCatPlay = null;
    this.render();
  },

  confirmCatSelection(){
    const me = this.me();
    if(!me || this.selectedCatIndices.length < 2) return;
    const card = me.hand[this.selectedCatIndices[0]];
    const count = this.selectedCatIndices.length;
    if(!this.selectedCatIndices.every(i => me.hand[i] === card)){
      this.toast('Các lá phải cùng loại!');
      this.cancelCatSelection();
      return;
    }
    this.pendingCatPlay = { card, count };

    const s = Engine.state;
    const targets = s.players.filter(p => p.alive && p.id !== me.id && p.hand.length > 0);
    if(targets.length === 0){
      this.toast('Không có ai để combo');
      this.cancelCatSelection();
      return;
    }

    this.openModal('cattarget', `
      <h2>${CARDS[card].icon} ${CARDS[card].name} ×${count}</h2>
      <p>Chọn mục tiêu:</p>
      <div class="mcol">
        ${targets.map(t => `<button onclick="UI.chooseCatTarget('${t.id}')">${this.escapeHtml(t.name)} (${t.hand.length} lá)</button>`).join('')}
      </div>
      <button class="btn-o" onclick="UI.closeModal(); UI.cancelCatSelection();">Hủy</button>
    `);
  },

  chooseCatTarget(targetId){
    const { card, count } = this.pendingCatPlay || {};
    if(!card) return;
    if(count === 3){
      this.showCatName(card, targetId);
    } else {
      const cards = [card, card];
      this.act('play', { cards, targetId });
      this.closeModal();
      this.cancelCatSelection();
    }
  },

  showCatName(card, targetId){
    const names = ['ATTACK','SKIP','FAVOR','SHUFFLE','SEE_FUTURE','NOPE',...CATS];
    this.openModal('catname', `
      <h2>Gọi tên lá muốn lấy</h2>
      <div class="mgrid">
        ${names.map(n => `<button onclick="UI.chooseCatName('${card}','${targetId}','${n}')">${CARDS[n].icon} ${CARDS[n].name}</button>`).join('')}
      </div>
      <button class="btn-o" onclick="UI.closeModal(); UI.cancelCatSelection();">Hủy</button>
    `);
  },

  chooseCatName(card, targetId, namedCard){
    const cards = [card, card, card];
    this.act('play', { cards, targetId, extra: { namedCard } });
    this.closeModal();
    this.cancelCatSelection();
  },

  onDrawClick(){
    const s = Engine.state;
    if(!s || s.phase!=='playing') return;
    if(s.pending || s.awaitingChoice) return;
    const me = this.me();
    if(!me || !me.alive) return;
    if(s.players[s.turnIdx].id !== me.id) return this.toast('Chưa đến lượt');
    this.selectedCatIndices = [];
    this.act('draw');
  },

  /* ---------- CHAT ---------- */
  toggleChat(){
    document.getElementById('chatPanel').classList.toggle('on');
    document.getElementById('chatOverlay').classList.toggle('on');
  },
  sendChat(){
    const inp = document.getElementById('chatInput');
    const txt = inp.value.trim();
    if(!txt) return;
    inp.value = '';
    const name = this.getMyName();
    this.addChatMsg(name, txt);
    if(Net.peer) Net.send({ type:'chat', name, text:txt });
  },
  addChatMsg(name, text){
    const box = document.getElementById('chatMsgs');
    const div = document.createElement('div');
    div.innerHTML = `<span class="u">${this.escapeHtml(name)}:</span> ${this.escapeHtml(text)}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  },
  escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
};

document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
